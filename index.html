<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tiny-LinkPix</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
    label { display:block; margin:.6rem 0 .2rem; }
    input, button { padding:.6rem; font-size:1rem; width:100%; max-width:480px; }
    form { max-width:480px; }
    .hint { color:#666; font-size:.9rem; margin:.3rem 0 1rem; }
    .res { margin-top:1rem; padding:1rem; background:#f6f7f9; border-radius:8px; }
    code { background:#eee; padding:0 .25rem; border-radius:4px; }
  </style>
</head>
<body>
  <h1>✨ Tiny-LinkPix</h1>
  <p>Ladda upp en bild med egen URL-slug.</p>

  <form id="f">
    <label>Token (x-upload-token)</label>
    <input name="token" placeholder="UPLOAD_TOKEN" required />
    <label>Slug (t.ex. <code>pizza-menyn</code>)</label>
    <input name="slug" pattern="[a-z0-9\-]{3,64}" required />
    <div class="hint">Endast små bokstäver, siffror och bindestreck. 3–64 tecken.</div>
    <label>Bildfil</label>
    <input type="file" name="file" accept="image/*" required />
    <button>Ladda upp</button>
  </form>
  <div class="res" id="res" hidden></div>

  <script>
    const f = document.getElementById('f');
    const resDiv = document.getElementById('res');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(f);
      const r = await fetch('/api/upload', { method:'POST', body: fd });
      const j = await r.json().catch(()=>({}));
      resDiv.hidden = false;
      resDiv.textContent = r.ok ? `Klart! ${j.url}` : `Fel: ${j.error || r.status}`;
    });
  </script>
</body>
</html>
